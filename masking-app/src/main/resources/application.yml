server:
  # 로컬 테스트용: 이 PC에서만 접속 가능. 서버 배포 시 4단계에서 인증과 함께 변경
  address: ${PIIMASK_BIND:127.0.0.1}
  port: ${PIIMASK_PORT:8080}

spring:
  application:
    name: pii-masker
  datasource:
    # 메타 DB. 설정·작업·실행 이력·감사 로그 저장
    url: "jdbc:h2:file:${piimask.data-dir}/meta;INIT=RUNSCRIPT FROM 'classpath:meta-schema.sql'"
    username: sa
    password: ""
  batch:
    # 작업은 화면·스케줄로만 실행(기동 시 자동 실행 안 함). 메타 테이블은 meta-schema.sql 이 만든다
    job:
      enabled: false
    jdbc:
      initialize-schema: never
      # 실행마다 (jobId, execId) 로 고유 인스턴스를 만들므로 SERIALIZABLE 이 필요 없다. 동시 시작 시 H2 충돌 방지
      isolation-level-for-create: read_committed

piimask:
  # 메타 DB 파일과 마스터키 파일 위치
  data-dir: ${PIIMASK_DATA_DIR:./data}
  actor: local-admin

logging:
  level:
    root: INFO
    com.zaxxer.hikari: WARN
